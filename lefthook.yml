# Self-hosted gate: this package enforces on itself what it ships to consumers.
pre-commit:
  parallel: false
  jobs:
    - name: fallow
      run: bun x fallow audit --quiet

    - name: typecheck
      run: bun run typecheck

    - name: test
      run: bun run test
    # dlinter:owned — managed by `dlinter init`; safe to re-run, do not rename
    - name: test:mutation:staged
      run: bun run test:mutation:staged
